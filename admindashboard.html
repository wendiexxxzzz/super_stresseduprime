<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - EduPrime</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="eduprime-styles.css">
    <style>
        body { background: #f8f9fa; padding: 0; margin: 0; }
        .admin-header {
            background: #0a3d2f;
            color: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="admin-header">
    <h2>EduPrime Admin</h2>
    <div>
        <span>Welcome, Administrator</span>
        <button onclick="logout()" style="margin-left:20px;">Logout</button>
    </div>
</div>

<div style="padding:30px;">
    <h1>Good morning, Administrator</h1>
    <p>Here's what's happening with your institution today.</p>

    <div class="admin-metrics" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin:30px 0;">
        <div class="metric-card"><h3>Total Students</h3><h2>5,024</h2><p>+42 this month</p></div>
        <div class="metric-card"><h3>Active Enrollments</h3><h2>3,891</h2><p>Across 6 courses</p></div>
        <div class="metric-card"><h3>Courses Offered</h3><h2>24</h2></div>
        <div class="metric-card"><h3>Departments</h3><h2>12</h2></div>
    </div>

    <div style="display:grid;grid-template-columns:2fr 1fr;gap:25px;">
        <div>
            <h3>Recent Enrollments</h3>
            <table class="admin-table" id="adminTable">
                <!-- Populated by JS -->
            </table>
        </div>
        <div>
            <h3>Recent Activity</h3>
            <div id="activityFeed"></div>
        </div>
    </div>
</div>

<script>
function logout() {
    if(confirm("Logout?")) window.location.href = "index.html";
}

// Sample Data
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('adminTable').innerHTML = `
        <thead><tr><th>Student</th><th>Course</th><th>Date</th><th>Status</th></tr></thead>
        <tbody>
            <tr><td>Maria Santos</td><td>CS101</td><td>2026-05-08</td><td>Active</td></tr>
            <tr><td>Ana Reyes</td><td>CS201</td><td>2026-05-10</td><td>Pending</td></tr>
        </tbody>
    `;
});
</script>
</body>
</html>
